<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f3a5f" />
    <meta name="description" content="Planificación y seguimiento de casos fiscales" />
    <link rel="icon" href="./icons/icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Gestión de Casos</title>
    <script>
      try {
        var t = localStorage.getItem('tema')
        if (t === 'claro' || t === 'oscuro') document.documentElement.setAttribute('data-tema', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
